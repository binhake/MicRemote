name: Build and Export IPAs

on:
  push:
    branches: [ main, 'v*' ]
    paths:
      - 'MicRemote/**'
      - 'MicListener/**'
      - '.github/workflows/build_ipa.yml'
  pull_request:
    branches: [ main, 'v*' ]
    paths:
      - 'MicRemote/**'
      - 'MicListener/**'
      - '.github/workflows/build_ipa.yml'
  workflow_dispatch:

jobs:
  build-ipas:
    name: Build IPAs
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check Changed Files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            remote:
              - 'MicRemote/**'
            listener:
              - 'MicListener/**'
            workflow:
              - '.github/workflows/build_ipa.yml'

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Build & Package IPAs
        run: |
          mkdir -p output_ipas

          SHOULD_BUILD_REMOTE="${{ steps.filter.outputs.remote == 'true' || steps.filter.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch' }}"
          SHOULD_BUILD_LISTENER="${{ steps.filter.outputs.listener == 'true' || steps.filter.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch' }}"

          build_app() {
            local APP_NAME=$1
            local PROJ_DIR="$APP_NAME"
            local XCODEPROJ="$PROJ_DIR/$APP_NAME.xcodeproj"
            local PLIST_PATH="$PROJ_DIR/$APP_NAME/Info.plist"
            local BUILD_DIR="/tmp/xcode_build_${APP_NAME}"
            local APP_PATH="$BUILD_DIR/Release-iphoneos/$APP_NAME.app"
            local TMP_PAYLOAD="/tmp/ipa_pack_${APP_NAME}"

            local VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST_PATH" 2>/dev/null || echo "1.0.0")
            local IPA_NAME="${APP_NAME}_v${VERSION}.ipa"
            local IPA_OUTPUT="$GITHUB_WORKSPACE/output_ipas/${IPA_NAME}"

            echo "===================================================="
            echo "📦 Building $APP_NAME (v$VERSION)..."
            echo "===================================================="

            rm -rf "$BUILD_DIR" "$TMP_PAYLOAD"
            mkdir -p "$BUILD_DIR"

            xcodebuild -project "$XCODEPROJ" \
                       -scheme "$APP_NAME" \
                       -sdk iphoneos \
                       -configuration Release \
                       -destination 'generic/platform=iOS' \
                       CODE_SIGNING_ALLOWED=NO \
                       BUILD_DIR="$BUILD_DIR" \
                       -quiet

            if [ -d "$APP_PATH" ]; then
              echo "🗜️ Packaging IPA Payload..."
              mkdir -p "$TMP_PAYLOAD/Payload"
              cp -R "$APP_PATH" "$TMP_PAYLOAD/Payload/"
              (cd "$TMP_PAYLOAD" && zip -qr "$IPA_OUTPUT" Payload)
              rm -rf "$TMP_PAYLOAD" "$BUILD_DIR"
              echo "✅ Successfully built: $IPA_OUTPUT"
            else
              echo "❌ Error: $APP_PATH not found after build!"
              exit 1
            fi
          }

          if [ "$SHOULD_BUILD_LISTENER" = "true" ]; then
            build_app "MicListener"
          else
            echo "⏭️ Skipping MicListener (no changes detected in MicListener/)"
          fi

          if [ "$SHOULD_BUILD_REMOTE" = "true" ]; then
            build_app "MicRemote"
          else
            echo "⏭️ Skipping MicRemote (no changes detected in MicRemote/)"
          fi

          echo "===================================================="
          echo "🎉 Finished building requested IPAs:"
          ls -lh output_ipas/

      - name: Upload IPAs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MicRemote-IPAs
          path: output_ipas/*.ipa
          retention-days: 30


